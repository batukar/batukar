name: activity-graph

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/activity_graph.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - run: |
          git config user.name "Batuhan Karadağ"
          git config user.email "52932122+batukar@users.noreply.github.com"
          git add activity-graph.svg
          git diff --cached --quiet || git commit -m "edited"
          git push
